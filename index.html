<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoniCoin Wallet (Final)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-box { background: white; width: 100%; max-width: 450px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 25px; font-weight: 700; }
        
        .info-card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .label { color: #888; }
        .value { font-weight: 600; color: #333; }
        
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: #4CAF50; outline: none; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.2s; }
        #connectBtn { background-color: #2196F3; color: white; }
        #connectBtn:hover { background-color: #1976D2; }
        #sendBtn { background-color: #4CAF50; color: white; margin-top: 10px; }
        #sendBtn:hover { background-color: #388E3C; }
        #sendBtn:disabled { background-color: #ccc; cursor: not-allowed; }

        .status { margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
        .status.success { background-color: #e8f5e9; color: #2e7d32; }
        .status.error { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="app-box">
    <h2>🚀 DoniCoin Wallet</h2>

    <div class="info-card">
        <div class="row">
            <span class="label">Status:</span>
            <span class="value" id="statusText">Disconnected</span>
        </div>
        <div class="row">
            <span class="label">Address:</span>
            <span class="value" id="myAddress">...</span>
        </div>
        <div class="row">
            <span class="label">Balance:</span>
            <span class="value" id="myBalance">0 DC</span>
        </div>
        <button id="connectBtn">Connect MetaMask</button>
    </div>

    <div style="margin-top: 20px;">
        <h3 style="margin-bottom: 15px; font-size: 18px;">Send Tokens</h3>
        <input type="text" id="toAddress" placeholder="Recipient Address (0x...)" />
        <input type="number" id="amount" placeholder="Amount (e.g. 10)" />
        <button id="sendBtn" disabled>Transfer Tokens</button>
    </div>

    <div id="msgBox" class="status"></div>
</div>

<script type="module">
    import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";

    // ТВОЙ АДРЕС УЖЕ ВСТАВЛЕН:
    const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
    
    const ABI = [
        "function decimals() view returns (uint8)",
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    let contract, signer;

    const connectBtn = document.getElementById("connectBtn");
    const sendBtn = document.getElementById("sendBtn");
    const msgBox = document.getElementById("msgBox");

    function showMsg(text, type) {
        msgBox.style.display = "block";
        msgBox.innerText = text;
        msgBox.className = "status " + type;
        setTimeout(() => msgBox.style.display = "none", 5000);
    }

    connectBtn.addEventListener("click", async () => {
        if (!window.ethereum) return showMsg("Please install MetaMask!", "error");

        try {
            await window.ethereum.request({ method: "eth_requestAccounts" });
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            const address = await signer.getAddress();

            document.getElementById("myAddress").innerText = address.slice(0,6) + "..." + address.slice(-4);
            document.getElementById("statusText").innerText = "Connected";
            document.getElementById("statusText").style.color = "green";

            contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
            
            await updateBalance(address);

            connectBtn.style.display = "none";
            sendBtn.disabled = false;

        } catch (err) {
            console.error(err);
            showMsg("Connection failed", "error");
        }
    });

    async function updateBalance(address) {
        try {
            const bal = await contract.balanceOf(address);
            document.getElementById("myBalance").innerText = ethers.formatUnits(bal, 18) + " DC";
        } catch (err) {
            console.error(err);
        }
    }

    sendBtn.addEventListener("click", async () => {
        const to = document.getElementById("toAddress").value;
        const amt = document.getElementById("amount").value;

        if (!to || !amt) return showMsg("Fill all fields!", "error");

        try {
            sendBtn.innerText = "Processing...";
            sendBtn.disabled = true;

            const amtWei = ethers.parseUnits(amt, 18);
            const tx = await contract.transfer(to, amtWei);
            
            showMsg("Transaction sent! Waiting...", "success");
            await tx.wait();
            
            showMsg("Transfer Successful! 🚀", "success");
            await updateBalance(await signer.getAddress());
            
        } catch (err) {
            console.error(err);
            showMsg("Failed: " + (err.reason || err.message), "error");
        } finally {
            sendBtn.innerText = "Transfer Tokens";
            sendBtn.disabled = false;
        }
    });
</script>

</body>
</html>
